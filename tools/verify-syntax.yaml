annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Execute language parser validation to guarantee zero syntax regression.
input_schema:
  additionalProperties: false
  properties:
    language:
      type: string
    transformed_code:
      type: string
  required:
  - transformed_code
  - language
  type: object
name: verify-syntax
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
