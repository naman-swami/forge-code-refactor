annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Inspect Abstract Syntax Tree nodes for anti-patterns and performance
  bottlenecks.
input_schema:
  additionalProperties: false
  properties:
    code_content:
      type: string
    language:
      type: string
  required:
  - code_content
  - language
  type: object
name: analyze-ast
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
