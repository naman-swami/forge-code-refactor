annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Generate standard unified diff format with line-by-line rationale.
input_schema:
  additionalProperties: false
  properties:
    original:
      type: string
    refactored:
      type: string
  required:
  - original
  - refactored
  type: object
name: compute-diff
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
