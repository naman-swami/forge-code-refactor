name: OpenGAP CI & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Unit Tests
        run: pytest tests/ -v
      - name: Verify OpenGAP Specification
        run: |
          python -c "import yaml; d=yaml.safe_load(open('agent.yaml')); assert d['spec_version']=='0.1.0'; print('OpenGAP Spec Validated')"
